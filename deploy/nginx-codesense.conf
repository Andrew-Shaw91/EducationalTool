# nginx site for CodeSense (Ubuntu 24.04).
#
# Install:
#   sudo cp deploy/nginx-codesense.conf /etc/nginx/sites-available/codesense
#   sudo ln -s /etc/nginx/sites-available/codesense /etc/nginx/sites-enabled/codesense
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# Works as-is for a public IP address (server_name _ matches any host name).
# When you get a domain name: change server_name below, then run certbot
# (DEPLOYMENT.md, "Adding a domain name and HTTPS"); certbot adds the HTTPS
# server block for you.
#
# Assumed paths: static files in /srv/codesense/app/staticfiles (created by
# `python manage.py collectstatic`); gunicorn on 127.0.0.1:8000.

# --- Basic protection for a small VM ------------------------------------------
# Each client IP may make about 20 requests per second (bursts of 60 allowed).
# Generous enough for a classroom sharing one IP; remove these two lines and the
# limit_req line below if it ever blocks legitimate use.
limit_req_zone $binary_remote_addr zone=codesense_per_ip:10m rate=20r/s;
limit_req_status 429;

upstream codesense_app {
    server 127.0.0.1:8000 fail_timeout=0;
}

server {
    # default_server: answer requests that arrive by IP address.
    listen 80 default_server;
    listen [::]:80 default_server;

    # Replace "_" with your domain when you have one, e.g. "example.org www.example.org".
    server_name _;

    server_tokens off;            # do not advertise the nginx version
    client_max_body_size 1m;      # forms only; no uploads
    keepalive_timeout 30s;

    access_log /var/log/nginx/codesense.access.log;
    error_log  /var/log/nginx/codesense.error.log warn;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml font/woff2;

    # --- Security headers -------------------------------------------------------
    # "always" adds them to error pages as well. The app loads only its own CSS,
    # JavaScript and fonts (no CDN), so the policy can be strict; inline styles
    # are allowed because a couple of templates use style="...".
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    # After HTTPS works (and USE_HTTPS=True), you may also add:
    #   add_header Strict-Transport-Security "max-age=3600" always;
    # Note: a "location" block that has its own add_header lines does not inherit
    # the ones above, so avoid add_header inside the blocks below.

    # --- Static files: served by nginx directly, never by Django ----------------
    location /static/ {
        alias /srv/codesense/app/staticfiles/;
        # Short cache: file names do not change when you update the CSS, so a
        # long cache would leave visitors with old styling after an update.
        expires 1h;
        access_log off;
    }

    # --- Optional: limit the Django admin to your own IP --------------------------
    # Remove the # marks and use your own address.
    #location /admin/ {
    #    allow 203.0.113.50;
    #    deny all;
    #    proxy_pass http://codesense_app;
    #    proxy_set_header Host $host;
    #    proxy_set_header X-Real-IP $remote_addr;
    #    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #    proxy_set_header X-Forwarded-Proto $scheme;
    #}

    # --- Everything else: the Django application -------------------------------
    location / {
        limit_req zone=codesense_per_ip burst=60 nodelay;

        proxy_pass http://codesense_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_redirect off;
    }
}
